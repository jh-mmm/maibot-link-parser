# ==============================================================================
#                      MaiBot 多平台链接解析器配置文件
# ==============================================================================
# 本插件支持自动解析 知乎、微博、YouTube、Twitter(X)、Pixiv 的分享链接或 PID，
# 并提取标题、作者、正文摘要、图片/画集、动图(GIF)、视频等内容在聊天中直接发送。
#
# 修改此文件后，请在 MaiBot 管理面板重载插件或重启 MaiBot 使配置生效。
# ==============================================================================


# ==============================================================================
# [plugin] 插件基础信息
# ==============================================================================
[plugin]
name = "maibot-link-parser"     # 插件唯一标识名（请勿修改）
config_version = "1.4.1"        # 配置文件版本（请勿修改）
version = "1.4.1"               # 插件版本（请勿修改）
enabled = true                  # 插件总开关：true=开启解析 | false=完全停用插件


# ==============================================================================
# [general] 通用全局设置
# ==============================================================================
[general]
timeout = 15                  # 全局网络请求超时时间（秒）。网络较慢或有波动时建议调大（如 20 或 30）
max_content_length = 500      # 正文摘要最大字符数（超过此长度会自动在句末断句截断并显示省略号）
max_video_size_mb = 50        # 允许下载并发送的最大视频体积（MB，超过限制则不发送视频文件）
max_video_duration = 300      # 允许下载并发送的最大视频时长（秒，300 即 5 分钟，超过限制则跳过）


# ==============================================================================
# [platforms] 各平台解析开关
# ==============================================================================
# 设置为 true 启用对应平台的链接解析，设置为 false 则完全跳过该平台的链接匹配
[platforms]
zhihu = true                  # 是否启用【知乎】链接解析
weibo = true                  # 是否启用【微博】链接解析
youtube = false               # 是否启用【YouTube】视频解析（国外网站，默认关闭，需要时改 true）
twitter = false               # 是否启用【Twitter/X】推文解析（国外网站，默认关闭，需要时改 true）
pixiv = true                  # 是否启用【Pixiv】插画/漫画/动图/小说解析


# ==============================================================================
# [zhihu] 知乎解析配置
# ==============================================================================
[zhihu]
# 知乎登录 Cookies：
# 知乎对未登录访问限制很严格，常出现反爬挑战页（zse-ck）或 403 拦截。
# 若遇到解析失败，请在电脑浏览器登录知乎 -> 按 F12 打开开发者工具 -> 在 Network(网络) 中找到任意请求的 Cookie 请求头，
# 整行复制粘贴到下方双引号内（例如 "z_c0=...; _zap=...;"）。
cookies = ""

# HTTP/HTTPS 代理地址（例如 "http://127.0.0.1:7890"），留空则直接连接
proxy = ""

# 访问控制（群聊 / 用户 QQ 号独立黑白名单）：
# - group_mode: 群名单模式。可选值："off"(不限制，所有群均可触发) | "whitelist"(仅白名单内的群可触发) | "blacklist"(黑名单内的群不触发)
# - group_whitelist: 群白名单列表，例如 ["12345678", "87654321"]。group_mode="whitelist" 时生效；若列表为空则所有群均不触发
# - group_blacklist: 群黑名单列表，例如 ["11223344"]。group_mode="blacklist" 时生效
# - user_mode: 用户名单模式。可选值："off"(不限制所有用户) | "whitelist"(仅白名单内用户可触发) | "blacklist"(黑名单内用户不触发)
# - user_whitelist: 用户 QQ 号白名单列表，例如 ["10001", "10002"]。user_mode="whitelist" 时生效；若列表为空则所有人均不触发
# - user_blacklist: 用户 QQ 号黑名单列表，例如 ["99999"]。user_mode="blacklist" 时生效
# 注：群与用户是「与」关系，两者均通过才会解析；私聊消息自动跳过群名单判定。
group_mode = "off"
group_whitelist = []
group_blacklist = []
user_mode = "off"
user_whitelist = []
user_blacklist = []


# ==============================================================================
# [weibo] 微博解析配置
# ==============================================================================
[weibo]
# 访问控制（群聊 / 用户 QQ 号独立黑白名单）：
# 可选模式同上："off" | "whitelist" | "blacklist"
group_mode = "off"
group_whitelist = []
group_blacklist = []
user_mode = "off"
user_whitelist = []
user_blacklist = []


# ==============================================================================
# [youtube] YouTube 解析配置
# ==============================================================================
[youtube]
# YouTube Data API v3 密钥（可选）：
# 申请地址：https://console.cloud.google.com/ 启用 YouTube Data API v3 并创建 API Key。
# 填写后可获取播放量、点赞数、精确时长等完整数据；留空则自动回退到免费公共 noembed 接口。
youtube_api_key = ""

# YouTube 登录 Cookies（可选）：
# 仅在需要使用 yt-dlp 下载年龄受限或仅会员可见的 YouTube 视频时才需要填写，普通视频留空即可。
cookies = ""

# 访问控制（群聊 / 用户 QQ 号独立黑白名单）：
group_mode = "off"
group_whitelist = []
group_blacklist = []
user_mode = "off"
user_whitelist = []
user_blacklist = []


# ==============================================================================
# [twitter] Twitter/X 推文解析配置
# ==============================================================================
[twitter]
# Twitter 自定义 API 地址与密钥（可选）：
# 默认两个都留空即可自动使用免费公共 fxtwitter API (api.fxtwitter.com)。
# 如果公共接口被限流，且您自建或使用了 fxtwitter 反代实例，请在此处填写实例地址与 Bearer Token。
twitter_api_key = ""
twitter_api_base_url = ""

# 访问控制（群聊 / 用户 QQ 号独立黑白名单）：
group_mode = "off"
group_whitelist = []
group_blacklist = []
user_mode = "off"
user_whitelist = []
user_blacklist = []


# ==============================================================================
# [pixiv] Pixiv 插画 / 漫画 / 动图 / 小说解析配置
# ==============================================================================
[pixiv]
# Pixiv 登录 Cookies（可选）：
# 用于访问仅登录可见或 R18 受限作品。
# 填写格式支持以下任意一种：
#   1. 直接填写完整的请求头 Cookie 字符串（整行复制粘贴，如 "PHPSESSID=123456_...; p_ab_id=...;"）
#   2. 仅填写 "PHPSESSID=123456_xxxxxxxx" 或其 Session Token 值（插件会自动兼容处理）
cookies = ""

# HTTP/HTTPS 代理地址（推荐国内用户配置）：
# 例如 "http://127.0.0.1:7890"，国内服务器直连 Pixiv API 可能会超时，配置本地代理可稳定访问。
proxy = ""

# 图片反向代理域名（可选）：
# 例如 "i.pixiv.re"，填写后插件会将图片域名 i.pximg.net 替换为该反代域名，实现国内免代理直连下载图片；留空则直接访问原图站。
img_proxy = ""

# R-18 / NSFW 限制级内容处理策略：
# 可选值：
#   "blur"   - 默认推荐。自动使用 Pillow 对作品封面进行高斯模糊打码，保护群聊安全，避免违规。
#   "ignore" - 遇到 R-18 / R-18G 作品时直接拦截，不发送图片，并回复友好提示。
#   "send"   - 不进行打码，直接发送原图（请注意群聊风控风险）。
nsfw = "blur"

# 图片清晰度选择：
# 可选值：
#   "regular"  - 默认推荐。标准清晰度大图（体积适中，加载和发送快）。
#   "original" - 原图（分辨率最高，但文件体积较大）。
image_quality = "regular"

# 漫画最大下载解析页数：
# 漫画可能包含数十页，设置最大页数可防止一次性下载过多图片造成刷屏或超时。
# 超过此限制时，插件会仅发送封面图并提示总页数。设置为 0 表示不限制全部下载。
max_manga_pages = 20

# 访问控制（群聊 / 用户 QQ 号独立黑白名单）：
group_mode = "off"
group_whitelist = []
group_blacklist = []
user_mode = "off"
user_whitelist = []
user_blacklist = []


# ==============================================================================
# [onebot] OneBot 消息发送接口配置
# ==============================================================================
[onebot]
# OneBot 实现（如 NapCat、go-cqhttp、LLOneBot 等）的 HTTP 监听地址与端口：
# 如果 OneBot 与 MaiBot 运行在同一台机器上，host 保持 "127.0.0.1" 即可；端口按您 OneBot 的实际配置填写。
host = "127.0.0.1"
port = 3000

# OneBot access_token：
# 如果您的 OneBot 客户端设置了密钥鉴权（Token），请在此填写；未设置请保持留空。
token = ""

# 机器人 QQ 号（可选）：
# 用于生成合并转发消息节点时的展示 QQ，普通消息发送不需要填写。
bot_uin = ""

# 合并转发发送：
# 是否对知乎解析结果与多图画集使用“合并转发”发送：
#   true  - 开启合并转发，多图与文本打包发送，避免逐条刷屏（发送失败时会自动降级为逐条发送）。
#   false - 关闭合并转发，全部采用逐条发送。
merge_send = true