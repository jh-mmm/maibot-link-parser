[plugin]
name = "maibot-link-parser"
config_version = "1.2.0"
version = "1.2.0"
enabled = true


[general]
timeout = 15
max_content_length = 500
max_video_size_mb = 50
max_video_duration = 300


[platforms]
zhihu = true
weibo = true
youtube = false
twitter = false


[youtube]
youtube_api_key = ""
cookies = ""


[zhihu]
# 请在此处填入知乎的 Cookies.
cookies = ""
# HTTP/HTTPS 代理地址（如 http://127.0.0.1:7890），留空则不使用代理
proxy = ""


[twitter]
twitter_api_key = ""
twitter_api_base_url = ""


# ==========================================
# OneBot HTTP 配置
# ==========================================

[onebot]

# OneBot HTTP 地址
# 如果 NapCat 和 MaiBot 在同一台机器：
host = "127.0.0.1"

# OneBot HTTP 服务端口
# 根据你的 NapCat / go-cqhttp 配置修改
port = 3000

# access_token
# 如果 OneBot 未开启 Token，保持为空
token = ""

# 机器人 QQ 号
# 用于合并转发节点
# 普通消息发送不需要
bot_uin = ""

# 合并转发发送
# 对知乎解析结果与多图结果使用合并转发（需 OneBot 实现支持，如 NapCat）
# 关闭后或发送失败时，自动回退为逐条发送
merge_send = true